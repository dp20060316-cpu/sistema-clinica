server.port=8080

# Conexion a SQL Server con la sesion de Windows (integratedSecurity).
# No lleva usuario ni clave. El pom.xml agrega la DLL que esto necesita.
# SQL Server debe tener TCP/IP activado en el puerto 1433.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MiBaseDeDatos;integratedSecurity=true;encrypt=true;trustServerCertificate=true

# Las tablas las crea database/clinica.sql; Hibernate no las modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
